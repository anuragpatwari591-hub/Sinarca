{% extends "base.html" %}
{% block title %}Create your account — {{ platform_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container onboarding-card">
    <div class="card">
      <h1>Create your free account</h1>
      <p class="text-muted">Takes under a minute. You'll build your Learning DNA right after.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" value="{{ name or '' }}" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required>
          <div class="help-text">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
      <p class="mt-md text-center">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
