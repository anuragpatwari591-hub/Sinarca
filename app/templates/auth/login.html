{% extends "base.html" %}
{% block title %}Log in — {{ platform_name }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container onboarding-card">
    <div class="card">
      <h1>Welcome back</h1>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" value="{{ email or '' }}" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>
      <p class="mt-md text-center">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
      <p class="text-center"><a href="{{ url_for('main.demo_login') }}">Or explore the Demo Student account →</a></p>
    </div>
  </div>
</section>
{% endblock %}
