{% extends "base.html" %}
{% block title %}{{ 'Edit' if resource.id else 'Add' }} Resource — {{ platform_name }}{% endblock %}
{% block content %}
<section class="section-tight">
  <div class="container" style="max-width:760px;">
    <h1>{{ 'Edit' if resource.id else 'Add' }} Resource</h1>
    <form method="post" class="card">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="grid grid-2">
        <div class="field"><label>Title</label><input type="text" name="title" value="{{ resource.title or '' }}" required></div>
        <div class="field"><label>Provider</label><input type="text" name="provider" value="{{ resource.provider or '' }}" required></div>
      </div>
      <div class="field"><label>Source URL</label><input type="text" name="url" value="{{ resource.url or '' }}" required></div>
      <div class="grid grid-2">
        <div class="field"><label>Category</label><input type="text" name="category" value="{{ resource.category or '' }}"></div>
        <div class="field"><label>Topic</label><input type="text" name="topic" value="{{ resource.topic or '' }}"></div>
      </div>
      <div class="field"><label>Skill tags (comma-separated slugs)</label><input type="text" name="skill_tags" value="{{ resource.skill_tags|join(', ') if resource.id else '' }}"></div>
      <div class="grid grid-2">
        <div class="field"><label>Difficulty</label>
          <select name="difficulty">{% for d in difficulties %}<option value="{{ d }}" {{ 'selected' if resource.difficulty == d }}>{{ d }}</option>{% endfor %}</select>
        </div>
        <div class="field"><label>Resource type</label>
          <select name="resource_type">{% for t in resource_types %}<option value="{{ t }}" {{ 'selected' if resource.resource_type == t }}>{{ t }}</option>{% endfor %}</select>
        </div>
      </div>
      <div class="grid grid-2">
        <div class="field"><label>Duration (minutes)</label><input type="number" name="duration_minutes" value="{{ resource.duration_minutes or '' }}"></div>
        <div class="field"><label>Language</label>
          <select name="language">{% for l in languages %}<option value="{{ l }}" {{ 'selected' if resource.language == l }}>{{ l }}</option>{% endfor %}</select>
        </div>
      </div>
      <div class="grid grid-2">
        <label class="checkbox-tile"><input type="checkbox" name="is_free" {{ 'checked' if resource.is_free }}> Free resource</label>
        <div class="field"><label>Price (INR, if paid)</label><input type="number" name="price_inr" value="{{ resource.price_inr or 0 }}"></div>
      </div>
      <div class="grid grid-3">
        <div class="field"><label>Rating (leave blank if unknown)</label><input type="number" step="0.1" min="0" max="5" name="rating" value="{{ resource.rating or '' }}"></div>
        <div class="field"><label>Rating count</label><input type="number" name="rating_count" value="{{ resource.rating_count or '' }}"></div>
        <div class="field"><label>Rating source</label><input type="text" name="rating_source" value="{{ resource.rating_source or '' }}" placeholder="e.g. YouTube, Coursera"></div>
      </div>
      <div class="field"><label>Description</label><textarea name="description" rows="3">{{ resource.description or '' }}</textarea></div>
      <div class="field"><label>Prerequisites</label><input type="text" name="prerequisites" value="{{ resource.prerequisites or '' }}"></div>
      <div class="field"><label>Format tags (comma-separated: video, reading, project-first...)</label><input type="text" name="format_tags" value="{{ resource.format_tags|join(', ') if resource.id else '' }}"></div>
      <div class="field"><label>Status</label>
        <select name="status">
          <option value="active" {{ 'selected' if resource.status == 'active' }}>Active</option>
          <option value="under_review" {{ 'selected' if resource.status == 'under_review' }}>Under review</option>
          <option value="broken" {{ 'selected' if resource.status == 'broken' }}>Broken</option>
          <option value="removed" {{ 'selected' if resource.status == 'removed' }}>Removed</option>
        </select>
      </div>
      <label class="checkbox-tile"><input type="checkbox" name="is_sponsored" {{ 'checked' if resource.is_sponsored }}> Sponsored placement</label>
      <div class="field mt-sm"><label>Affiliate URL (optional)</label><input type="text" name="affiliate_url" value="{{ resource.affiliate_url or '' }}"></div>
      <button type="submit" class="btn btn-primary mt-md">Save resource</button>
    </form>
  </div>
</section>
{% endblock %}
